name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find boardy -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Python syntax check
        run: python -m compileall boardy-api/ -q

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup root env file for Docker Compose
        run: cp .env.example .env
      
      - name: Setup Laravel env file
        run: cp boardy/.env.example boardy/.env

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml build
      
      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
      
      - name: Create Laravel directories inside container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel mkdir -p /var/www/html/bootstrap/cache
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel mkdir -p /var/www/html/storage/framework/sessions
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel mkdir -p /var/www/html/storage/framework/views
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel mkdir -p /var/www/html/storage/framework/cache/data
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel mkdir -p /var/www/html/storage/logs
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel chown -R www-data:www-data /var/www/html/bootstrap
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T laravel chown -R www-data:www-data /var/www/html/storage
      
      - name: Wait for stack
        run: |
          for i in {1..30}; do curl -fs http://localhost/health && break; sleep 2; done
      
      - name: Check Laravel logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs laravel

      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health
          curl -f http://localhost/api/health
      
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Laravel env file
        run: cp boardy/.env.example boardy/.env
      
      - name: Setup Node and build assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Node dependencies
        working-directory: ./boardy
        run: npm ci
      
      - name: Build assets
        working-directory: ./boardy
        run: npm run build
      
      #ЗАГЛУШКА ДЛЯ REDIS
      - name: Override Redis for tests
        run: |
          echo "CACHE_STORE=array" >> boardy/.env
          echo "SESSION_DRIVER=array" >> boardy/.env
          echo "QUEUE_CONNECTION=sync" >> boardy/.env
          echo "REDIS_HOST=127.0.0.1" >> boardy/.env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      
      - name: Install PHP deps
        working-directory: ./boardy
        run: composer install --no-interaction --prefer-dist
      
      - name: Run PHPUnit
        working-directory: ./boardy
        run: php artisan test
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Python deps
        run: pip install -r boardy-api/requirements.txt pytest httpx
      
      - name: Run pytest
        working-directory: ./boardy-api
        env:
          OAUTH_PUBLIC_KEY: ./oauth-public.key
        run: PYTHONPATH=. pytest -v